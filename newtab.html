<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17171b">
    <title>yunagi</title>
    <!-- Обои качаются с первого кадра: к моменту появления интерфейса
         фон уже готов, и страница проявляется одной волной, без «выскакивания» картинки. -->
    <link rel="preload" href="Image.webp" as="image" fetchpriority="high">
    <!-- Подсказки соединений: фавиконы закладок и погода — первым делом после открытия вкладки. -->
    <link rel="preconnect" href="https://www.google.com">
    <link rel="preconnect" href="https://api.met.no" crossorigin>
    <link rel="preconnect" href="https://geocoding-api.open-meteo.com" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="page-enter">
    <div class="wallpaper" aria-hidden="true"></div>
    <video class="wallpaper-video" id="wallpaperVideo" muted loop playsinline aria-hidden="true"></video>
    <div class="wallpaper-shade" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <canvas class="snow-canvas" id="snowCanvas" aria-hidden="true"></canvas>

    <main class="canvas">
      <section class="left-stack" id="leftStack" aria-label="Погода и закладки">
        <button class="glass weather-card widget" data-layout-item="weather" data-widget="weather" type="button" aria-label="Погода. Нажми, чтобы увидеть прогноз">
          <span class="weather-icon" id="weatherIcon" aria-hidden="true">☁</span>
          <span class="weather-copy">
            <span class="weather-temp" id="weatherTemp">—°</span>
            <span class="weather-city" id="weatherCity">Загрузка…</span>
            <span class="weather-description" id="weatherDescription">Обновляем прогноз</span>
          </span>
        </button>

        <section class="glass bookmarks-card widget" data-layout-item="bookmarks" data-widget="bookmarks" aria-label="Избранные сайты">
          <div class="card-heading">
            <span>ИЗБРАННОЕ</span>
          </div>
          <div class="bookmark-grid" id="bookmarkGrid"></div>
        </section>
      </section>

      <section class="right-stack" aria-label="Дата и время">
        <button class="glass date-card widget" data-layout-item="date" data-widget="clock" type="button" aria-label="Дата и время">
          <span class="date-weekday" id="weekday">ВТОРНИК</span>
          <span class="date-main"><span class="date-day" id="day">06</span><span class="date-month" id="month">ОКТ</span></span>
          <span class="date-year" id="year">2026</span>
        </button>
        <button class="glass clock-card widget" id="clockCard" data-layout-item="clock" data-widget="clock" data-display="both" type="button" aria-label="Часы">
          <span class="analog-clock" aria-hidden="true"><i class="clock-hand hour-hand" id="hourHand"></i><i class="clock-hand minute-hand" id="minuteHand"></i><i class="clock-pin"></i></span>
          <span class="digital-time" id="digitalTime">00:00</span>
        </button>
      </section>

      <section class="search-area" data-layout-item="search" aria-label="Поиск">
        <form class="glass search-box" id="searchForm" autocomplete="off">
          <span class="search-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.4"></circle><path d="m16 16 4.2 4.2"></path></svg></span>
          <input id="searchInput" type="search" placeholder="Искать в тишине…" aria-label="Поисковый запрос" spellcheck="false">
          <button class="engine-button" id="engineButton" type="button" aria-label="Выбрать поисковую систему" title="Поисковая система">G</button>
          <span class="search-hint" aria-hidden="true">↵</span>
        </form>
        <span class="search-caption" id="searchCaption" role="button" tabindex="0" title="Нажми, чтобы сменить фразу" aria-label="Подпись. Нажми, чтобы сменить фразу">ТИШИНА. ТВОЁ ПРОСТРАНСТВО.</span>
      </section>

      <section class="focus-panel glass" id="focusPanel" aria-label="Режим фокуса" aria-hidden="true">
        <span class="focus-kicker">yunagi / focus</span>
        <h1>Один момент за раз.</h1>
        <label class="focus-field-label" for="focusNote">ТВОЁ НАМЕРЕНИЕ</label>
        <textarea id="focusNote" maxlength="240" placeholder="Что сегодня действительно важно?" rows="2"></textarea>
        <div class="focus-task-heading"><span class="focus-field-label">МАЛЕНЬКИЕ ШАГИ</span><span class="focus-task-count" id="taskCount">0</span></div>
        <form class="focus-task-form" id="taskForm">
          <input id="taskInput" type="text" maxlength="100" placeholder="Добавить задачу…" aria-label="Новая задача">
          <button type="submit" aria-label="Добавить задачу">＋</button>
        </form>
        <ul class="focus-task-list" id="taskList"></ul>
      </section>

      <section class="idle-overlay" id="idleOverlay" aria-label="Часы и погода" aria-hidden="true">
        <time class="idle-time" id="idleTime">00:00</time>
        <div class="idle-weather" id="idleWeather" title="Погода">
          <span id="idleWeatherIcon" aria-hidden="true">☁</span>
          <span id="idleWeatherText">Загружаем погоду…</span>
        </div>
      </section>

      <button class="focus-trigger" id="toggleFocusMode" type="button" aria-label="Включить режим фокуса" title="Режим фокуса · F">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.7"></circle></svg>
      </button>
      <button class="layout-trigger" id="toggleLayoutEdit" type="button" aria-label="Редактировать расположение блоков" title="Редактор расположения и размеров"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="11" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="18" width="7" height="3" rx="1.5"/></svg></button>
      <div class="layout-edit-bar" id="layoutEditBar" aria-hidden="true" inert role="region" aria-label="Конструктор страницы">
        <div class="editor-heading"><span class="editor-kicker">ТВОЁ ПРОСТРАНСТВО</span><strong>Конструктор страницы</strong></div>
        <div class="editor-actions">
          <button class="editor-tool" id="toggleEditorGrid" type="button" aria-pressed="true" title="Показать сетку"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg><span>Сетка</span></button>
          <button class="editor-tool" id="resetWidgetLayout" type="button" title="Вернуть исходное расположение"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg><span>Сбросить</span></button>
          <span class="editor-divider"></span>
          <button class="editor-tool" id="cancelLayoutEdit" type="button">Отмена</button>
          <button class="drawer-button primary editor-done" id="finishLayoutEdit" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>Готово</button>
        </div>
        <div class="editor-footer"><span id="editorSelection" aria-live="polite">Выбери блок и перетащи на новое место</span><span class="editor-key-hint">Esc · сохранить и выйти</span></div>
      </div>
      <button class="settings-trigger" id="openGeneralSettings" type="button" aria-label="Общие настройки" title="Общие настройки">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.6 2.2-2 .9-2-.6-2 3.5 1.5 1.6v2.8L2.4 15l2 3.5 2-.6 2 .9L9 21h4l.6-2.2 2-.9 2 .6 2-3.5-1.5-1.6v-2.8L19.6 9l-2-3.5-2 .6-2-.9L13 3Z" transform="translate(1 0)"/><circle cx="12" cy="12" r="3.2"/></svg>
      </button>

      <a class="brand-mark" href="https://github.com/ahu1e/yunagi.git" target="_blank" rel="noopener noreferrer" aria-label="夕凪 — открыть репозиторий yunagi на GitHub" title="Открыть GitHub">
        <span class="brand-name">
          <span class="brand-name-kanji" aria-hidden="true">夕凪</span>
          <span class="brand-name-latin" aria-hidden="true">yunagi</span>
        </span>
      </a>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <dialog class="weather-panel" id="weatherPanel" aria-hidden="true" aria-labelledby="weatherDialogTitle"></dialog>
    <div class="drawer-scrim" id="drawerScrim"></div>
    <aside class="settings-drawer" id="settingsDrawer" role="dialog" aria-modal="true" inert aria-hidden="true" aria-labelledby="drawerTitle">
      <div class="drawer-topline"><span class="drawer-kicker">yunagi / personalize</span><button class="close-drawer" id="closeDrawer" type="button" aria-label="Закрыть настройки">×</button></div>
      <div class="drawer-body">
        <nav class="drawer-nav" id="drawerNav" aria-label="Разделы настроек"></nav>
        <div class="drawer-scroll" id="drawerContent"></div>
      </div>
    </aside>

    <script src="newtab.js"></script>
  </body>
</html>
